<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Ordering System</title>
  <style>
    body {
      background: #f4f7f8;
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="number"],
    input[type="text"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    input[type="submit"] {
      background: #28a745;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    input[type="submit"]:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Restaurant Ordering System</h2>
    <form action="http://192.168.8.150:5000/submit_order" method="post">
      <label for="table">Table Number:</label>
      <input type="number" id="table" name="table" required>

      <label for="allergen">Allergen:</label>
      <input type="text" id="allergen" name="allergen">

      <label for="dish">Dish:</label>
      <input type="text" id="dish" name="dish" required>

      <input type="submit" value="Place Order">
    </form>
  </div>
</body>
</html>
